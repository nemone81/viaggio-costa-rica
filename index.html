      --line: #26362E;
      --accent: #4FB894;
      --accent-soft: #16342A;
      --sea: #5FC2D3;
      --sea-soft: #12313A;

  :root[data-theme="dark"] {

    --surface: #131E19;
    --surface-2: #1B2A23;
    --ink: #E6EEE8;
    --ink-2: #A5B7AC;
    --ink-3: #7B8D83;
    --line: #26362E;
    --accent: #4FB894;
    --accent-soft: #16342A;
    --sea: #5FC2D3;
    --sea-soft: #12313A;

    --sun-soft: #33280F;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -12px rgba(0, 0, 0, .6);

  :root[data-theme="light"] {
    --ground: #F2F5EF;
    --surface: #FFFFFF;
    --surface-2: #E8EFE5;
    --ink: #14211B;
    --ink-2: #4C5C54;
    --ink-3: #74857B;
    --line: #D7E0D4;
    --accent: #0F6B52;
    --accent-soft: #DCEBE3;
    --sea: #17707F;
    --sea-soft: #DCEDF0;
    --sun: #A66C12;

  body {

  .wrap { max-width: 720px; margin: 0 auto; padding: 0 var(--pad) 96px; }

  .masthead { padding: 26px 0 14px; }

  .eyebrow {
    font-size: 11.5px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 600;
  }

  h1 {

  .dates {

    font-size: 13px;
    color: var(--ink-2);

  .stats {

  .stat {

  /* ---------- spine: the 8 bases in order ---------- */

  .spine-label {
    font-size: 11.5px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 600;
    margin: 26px 0 9px;
  }

  .spine {
    display: flex;
    gap: 0;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 4px;
    margin: 0 calc(var(--pad) * -1);
    padding-left: var(--pad);
    padding-right: var(--pad);
  }

  .spine::-webkit-scrollbar { display: none; }

  .leg {
    flex: 0 0 auto;
    display: flex;
    align-items: stretch;
  }

  .leg button {
    appearance: none;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 7px 11px;
    font: inherit;
    font-size: 13px;
    color: var(--ink);
    text-align: left;
    cursor: pointer;
    white-space: nowrap;
    transition: background .18s, border-color .18s;
  }

  .leg button:hover { border-color: var(--accent); }
  .leg button .nights {
    display: block;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--ink-3);
    letter-spacing: -.01em;
  }

  .leg .link {
    flex: 0 0 18px;
    align-self: center;
    height: 1px;
    background: var(--line);
  }

  .controls {

    top: 0;
    z-index: 20;
    background: color-mix(in srgb, var(--ground) 88%, transparent);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    margin: 20px calc(var(--pad) * -1) 0;
    padding: 10px var(--pad);
    border-bottom: 1px solid transparent;
    transition: border-color .2s;
  }

  .controls.stuck { border-bottom-color: var(--line); }

  .tabs {
    display: flex;
    gap: 3px;
    background: var(--surface-2);
    padding: 3px;
    border-radius: 11px;

  .tabs button {
    flex: 1;
    appearance: none;
    background: transparent;
    border: 0;
    border-radius: 9px;
    padding: 8px 6px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--ink-2);
    cursor: pointer;
    transition: background .18s, color .18s;

    color: var(--ink);
    box-shadow: var(--shadow);
  }

  .searchrow {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    align-items: center;

  .search {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
  }

  .search svg {
    position: absolute;
    left: 10px;
    width: 15px;
    height: 15px;
    color: var(--ink-3);
    pointer-events: none;
  }

  .search input {
    width: 100%;
    appearance: none;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 12px 9px 32px;
    font: inherit;
    font-size: 15px;
    color: var(--ink);
  }

  .search input::placeholder { color: var(--ink-3); }
  .search input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .ghost {
    appearance: none;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 12px;
    font: inherit;
    font-size: 13px;
    color: var(--ink-2);
    cursor: pointer;
    white-space: nowrap;
  }

  .ghost:hover { color: var(--ink); border-color: var(--accent); }

  /* ---------- day cards ---------- */

  .list { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }

  .day {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    scroll-margin-top: 108px;
  }

  .day.today { border-color: var(--accent); }

  .day > summary {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    padding: 13px 14px;
    cursor: pointer;
    list-style: none;
    position: relative;
  }

  .day > summary::-webkit-details-marker { display: none; }
  .day > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }

  .daymark {
    flex: 0 0 42px;
    text-align: center;
    padding-top: 1px;
  }

  .daymark .dnum {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--ink-3);
    letter-spacing: .04em;

  .daymark .dday {

    font-size: 25px;
    line-height: 1.05;
    font-weight: 600;
    letter-spacing: -.02em;
  }

  .daymark .dmon {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--ink-3);
  }

  .today .daymark .dday { color: var(--accent); }

  .dayhead { flex: 1; min-width: 0; }

  .place {
    font-family: var(--serif);
    font-size: 19px;
    line-height: 1.25;
    font-weight: 600;
    letter-spacing: -.01em;
    text-wrap: balance;

  .place .arrow { color: var(--sea); font-weight: 400; }

  .teaser {
    font-size: 13.5px;
    color: var(--ink-2);
    margin-top: 3px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .day[open] .teaser { display: none; }

  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }

  .chip {
    font-size: 11.5px;
    line-height: 1;
    padding: 5px 8px;
    border-radius: 6px;
    background: var(--surface-2);
    color: var(--ink-2);
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }

  .chip b { font-family: var(--mono); font-weight: 600; font-variant-numeric: tabular-nums; }
  .chip.move { background: var(--sea-soft); color: var(--sea); }
  .chip.cost { background: var(--sun-soft); color: var(--sun); }
  .chip.flag { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

  .caret {
    flex: 0 0 auto;
    align-self: center;
    width: 20px;
    height: 20px;
    color: var(--ink-3);
    transition: transform .22s ease;
  }

  .day[open] .caret { transform: rotate(180deg); }

  /* ---------- day body ---------- */

  .body { padding: 0 14px 14px; }
  .day[open] .body { animation: reveal .26s ease both; }

  @keyframes reveal {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .day[open] .body { animation: none; }
    .caret { transition: none; }
    * { scroll-behavior: auto !important; }
  }

  .sect { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
  .sect:first-child { border-top: 0; margin-top: 0; padding-top: 2px; }

  .sect > h3 {
    font-size: 11px;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 600;
    margin: 0 0 8px;
  }

  .timeline { display: flex; flex-direction: column; gap: 12px; }

  .slot { display: flex; gap: 11px; }

  .slot .rail {
    flex: 0 0 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 6px;
  }

  .slot .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    flex: 0 0 auto;
  }

  .slot .stem { flex: 1; width: 1px; background: var(--line); margin-top: 4px; }
  .slot:last-child .stem { display: none; }

  .slot .when {
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .slot p { margin: 2px 0 0; font-size: 15px; }

  .tip {
    margin-top: 7px;
    padding: 8px 10px;
    background: var(--surface-2);
    border-radius: 9px;
    font-size: 13.5px;
    color: var(--ink-2);
  }

  .tip .tl {
    display: block;
    font-size: 10.5px;
    letter-spacing: .1em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--ink-3);
    margin-bottom: 2px;
  }

  .plain { margin: 0; font-size: 15px; }
  .plain + .plain { margin-top: 6px; }

  .note-box {
    display: flex;
    gap: 9px;
    font-size: 14px;
    color: var(--ink-2);

  .stay {

  .daylinks { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 11px; }

  .daylink {
    appearance: none;
    background: var(--surface-2);

    padding: 6px 9px;

    align-items: baseline;
    padding: 14px;

    font-family: var(--mono);

    font-weight: 600;
    color: var(--ink);

  }

  .empty {
    text-align: center;
    color: var(--ink-3);
    font-size: 14px;
    padding: 40px 0;
  }

  mark {
    background: var(--accent-soft);
    color: inherit;
    border-radius: 3px;
    padding: 0 2px;
  }

  .foot {
    margin-top: 28px;
    font-size: 12px;
    color: var(--ink-3);
    text-align: center;
    line-height: 1.7;
  }

  .foot .src {
    display: inline-block;
    margin-bottom: 4px;
    padding: 7px 13px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    color: var(--accent);
    font-size: 13px;
    font-weight: 500;
    text-decoration: none;
  }

  .foot .src:hover { border-color: var(--accent); }
  .foot .src:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  [hidden] { display: none !important; }
</style>

  const LEGS = [

  /* ============ utility ============ */

  const MESI = ["gen", "feb", "mar", "apr", "mag", "giu", "lug", "ago", "set", "ott", "nov", "dic"];
  const GIORNI = ["dom", "lun", "mar", "mer", "gio", "ven", "sab"];

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const d = (iso) => new Date(iso + "T12:00:00");
  const fmt = (iso) => { const x = d(iso); return GIORNI[x.getDay()] + " " + x.getDate() + " " + MESI[x.getMonth()]; };
  const eur = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ".") + " €";
  const today = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate(), 12); };

  const stayById = (id) => STAYS.find((s) => s.id === id);
  const nightsOf = (id) => DAYS.filter((x) => x.stay === id).length;

  const dayText = (day) => [
    day.place, day.flag || "", day.move || "", day.note || "",
    day.blocks.map((b) => (b.when || b.label || "") + " " + b.text).join(" "),
    day.stay ? [stayById(day.stay).name, stayById(day.stay).meta].join(" ") : ""
  ].join(" ").toLowerCase();

  const placeHTML = (p) => esc(p).replace(/→/g, '<span class="arrow">→</span>');

  const teaserOf = (day) => {
    const b = day.blocks[0];
    return (b.when ? b.when + ": " : "") + b.text;
  };

  /* ============ testata ============ */

  const totalStays = STAYS.reduce((a, s) => a + s.price, 0);

  function renderStats() {
    const t = today();
    const start = d(DAYS[0].date), end = d(DAYS[DAYS.length - 1].date);
    const items = [
      ["Giorni", DAYS.length],
      ["Tappe", LEGS.length],
      ["Alloggi", eur(totalStays)]
    ];
    let live = "";
    if (t < start) {
      const gg = Math.round((start - t) / 86400000);
      live = '<span class="stat live"><b>-' + gg + '</b> ' + (gg === 1 ? "giorno alla partenza" : "giorni alla partenza") + "</span>";
    } else if (t <= end) {
      const n = Math.round((t - start) / 86400000) + 1;
      live = '<span class="stat live">Oggi è il <b>giorno ' + n + "</b></span>";
    }
    document.getElementById("stats").innerHTML =
      live + items.map(([k, v]) => '<span class="stat"><b>' + esc(v) + "</b> " + k + "</span>").join("");
  }

  function renderSpine() {
    document.getElementById("spine").innerHTML = LEGS.map((leg, i) => {
      const nn = nightsOf(leg.id);
      return '<div class="leg">' + (i ? '<span class="link"></span>' : "") +
        '<button type="button" data-leg="' + leg.id + '">' + esc(leg.name) +
        '<span class="nights">' + (nn ? nn + (nn === 1 ? " notte" : " notti") : "in giornata") + "</span></button></div>";
    }).join("");
  }

  /* ============ vista giorni ============ */

  const caret = '<svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';

  function blocksHTML(day) {
    let out = "", open = false;
    day.blocks.forEach((b) => {
      if (b.k === "slot") {
        if (!open) { out += '<div class="timeline">'; open = true; }
        out += '<div class="slot"><div class="rail"><span class="dot"></span><span class="stem"></span></div>' +
          '<div><span class="when">' + esc(b.when) + '</span><p>' + esc(b.text) + "</p></div></div>";
      } else if (b.k === "tip") {
        const tip = '<div class="tip"><span class="tl">' + esc(b.label) + "</span>" + esc(b.text) + "</div>";
        if (open) {
          out = out.replace(/<\/div><\/div>$/, "</div>" + tip + "</div>");
        } else {
          out += tip;
        }
      } else {
        if (open) { out += "</div>"; open = false; }
        out += '<p class="plain">' + esc(b.text) + "</p>";
      }
    });
    if (open) out += "</div>";
    return out;
  }

  function stayHTML(day) {
    const s = stayById(day.stay);
    if (!s) return "";
    const first = DAYS.find((x) => x.stay === s.id) === day;
    return '<div class="stay"><div class="name">' + esc(s.name) + "</div>" +
      (s.meta ? '<div class="meta">' + esc(s.meta) + "</div>" : "") +
      '<div class="row">' +
      (first ? '<span class="chip cost"><b>' + eur(s.price) + "</b> totale</span>" : '<span class="chip">stessa struttura</span>') +
      '<span class="chip"><b>' + nightsOf(s.id) + "</b> notti</span>" +
      (s.by ? '<span class="chip">prenota ' + esc(s.by) + "</span>" : "") +
      (day.stayUnsure ? '<span class="chip flag">notte non indicata sul foglio</span>' : "") +
      "</div></div>";
  }

  function dayHTML(day) {
    const dt = d(day.date);
    const isToday = +dt === +today();
    const chips = [];
    if (day.flag) chips.push('<span class="chip flag">' + esc(day.flag) + "</span>");
    if (day.kind === "volo") chips.push('<span class="chip move">volo</span>');
    if (day.moveTag) chips.push('<span class="chip move">trasferimento <b>' + esc(day.moveTag) + "</b></span>");
    if (day.stay && DAYS.find((x) => x.stay === day.stay) === day) {
      chips.push('<span class="chip cost"><b>' + eur(stayById(day.stay).price) + "</b> alloggio</span>");
    }
    if (day.note) chips.push('<span class="chip">nota</span>');

    const sections = [];
    sections.push('<div class="sect"><h3>Programma</h3>' + blocksHTML(day) + "</div>");
    if (day.move) {
      sections.push('<div class="sect"><h3>' + (day.moveAlt ? "Spostamento (variante sul foglio)" : "Spostamento") +
        '</h3><p class="plain">' + esc(day.move) + "</p></div>");
    }
    if (day.note) {
      sections.push('<div class="sect"><h3>Note</h3><div class="note-box"><span class="bar"></span><div>' + esc(day.note) + "</div></div></div>");
    }
    if (day.stay) sections.push('<div class="sect"><h3>Dove dormiamo</h3>' + stayHTML(day) + "</div>");

    return '<details class="day' + (isToday ? " today" : "") + '" id="g' + day.n + '" data-day="' + day.n + '">' +
      '<summary><div class="daymark"><div class="dnum">G' + day.n + '</div><div class="dday">' + dt.getDate() +
      '</div><div class="dmon">' + MESI[dt.getMonth()] + "</div></div>" +
      '<div class="dayhead"><div class="place">' + placeHTML(day.place) + "</div>" +
      '<div class="teaser">' + esc(teaserOf(day)) + "</div>" +
      (chips.length ? '<div class="chips">' + chips.join("") + "</div>" : "") +
      "</div>" + caret + "</summary>" +
      '<div class="body">' + sections.join("") + "</div></details>";
  }

  /* ============ vista tappe ============ */

  function legsHTML() {
    return LEGS.map((leg) => {
      const days = DAYS.filter((x) => x.leg === leg.id);
      const s = stayById(leg.id);
      const nn = nightsOf(leg.id);
      const range = days.length > 1 ? fmt(days[0].date) + " → " + fmt(days[days.length - 1].date) : fmt(days[0].date);
      return '<article class="card" data-leg-card="' + leg.id + '"><h2>' + esc(leg.name) + "</h2>" +
        '<div class="sub">' + esc(range) + " · " + (nn ? nn + (nn === 1 ? " notte" : " notti") : "in giornata") + " · " + esc(leg.tag) + "</div>" +
        '<p class="lead">' + esc(leg.lead) + "</p>" +
        (s ? '<div class="row" style="display:flex;flex-wrap:wrap;gap:5px;margin-top:10px">' +
          '<span class="chip">' + esc(s.name) + '</span><span class="chip cost"><b>' + eur(s.price) + "</b></span></div>" : "") +
        '<div class="daylinks">' + days.map((x) => '<button class="daylink" data-goto="' + x.n + '">G' + x.n + " · " + esc(fmt(x.date)) + "</button>").join("") + "</div>" +
        "</article>";
    }).join("");
  }

  /* ============ vista alloggi ============ */

  function staysHTML() {
    const t = today();
    const cards = STAYS.map((s) => {
      const days = DAYS.filter((x) => x.stay === s.id);
      const nn = days.length;
      const cd = d(s.canc);
      const gg = Math.round((cd - t) / 86400000);
      let cls = "", label;
      if (gg < 0) { cls = " past"; label = "cancellazione scaduta il " + fmt(s.canc); }
      else if (gg <= 3) { cls = " warn"; label = "cancellazione gratuita entro " + fmt(s.canc) + (gg === 0 ? " · oggi" : " · fra " + gg + (gg === 1 ? " giorno" : " giorni")); }
      else { label = "cancellazione gratuita entro " + fmt(s.canc); }

      return '<article class="card"><div class="stayhead"><div><h2>' + esc(s.name) + "</h2>" +
        '<div class="sub">' + esc(s.area) + " · " + fmt(days[0].date) + " → " + fmt(days[nn - 1].date) + "</div></div>" +
        '<div class="amt">' + eur(s.price) + "</div></div>" +
        (s.meta ? '<p class="lead">' + esc(s.meta) + "</p>" : "") +
        '<div class="row" style="display:flex;flex-wrap:wrap;gap:5px;margin-top:11px">' +
        '<span class="chip"><b>' + nn + "</b> " + (nn === 1 ? "notte" : "notti") + "</span>" +
        '<span class="chip"><b>' + eur(Math.round(s.price / nn)) + "</b> a notte</span>" +
        (s.by ? '<span class="chip">prenotato da ' + esc(s.by) + "</span>" : "") +
        '<span class="deadline' + cls + '">' + esc(label) + "</span></div>" +
        '<div class="daylinks">' + days.map((x) => '<button class="daylink" data-goto="' + x.n + '">G' + x.n + "</button>").join("") + "</div>" +
        "</article>";
    }).join("");

    const notti = STAYS.reduce((a, s) => a + nightsOf(s.id), 0);
    return cards + '<div class="total"><div>Totale alloggi<br><span style="font-size:12px;color:var(--ink-3)">' +
      notti + " notti · media " + eur(Math.round(totalStays / notti)) + ' a notte</span></div><div class="big">' + eur(totalStays) + "</div></div>";
  }

  /* ============ montaggio ============ */

  const elDays = document.getElementById("days");
  const elLegs = document.getElementById("legs");
  const elStays = document.getElementById("stays");
  const elQ = document.getElementById("q");
  const elToggle = document.getElementById("toggleAll");
  const elSearchRow = document.getElementById("searchrow");

  renderStats();
  renderSpine();
  elDays.innerHTML = DAYS.map(dayHTML).join("") + '<p class="empty" id="noResults" hidden>Nessun giorno corrisponde alla ricerca.</p>';
  elLegs.innerHTML = legsHTML();
  elStays.innerHTML = staysHTML();

  /* viste */
  let view = "days";
  document.querySelectorAll(".tabs button").forEach((btn) => {
    btn.addEventListener("click", () => {
      view = btn.dataset.view;
      document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-selected", String(b === btn)));
      elDays.hidden = view !== "days";
      elLegs.hidden = view !== "legs";
      elStays.hidden = view !== "stays";
      elSearchRow.hidden = view !== "days";
    });
  });

  /* ricerca */
  elQ.addEventListener("input", () => {
    const q = elQ.value.trim().toLowerCase();
    let visible = 0;
    DAYS.forEach((day) => {
      const el = document.getElementById("g" + day.n);
      const hit = !q || dayText(day).includes(q);
      el.hidden = !hit;
      if (hit) visible++;
      if (q && hit) el.open = true;
      if (!q) el.open = +d(day.date) === +today();
    });
    document.getElementById("noResults").hidden = visible > 0;
  });

  /* apri / chiudi tutto */
  elToggle.addEventListener("click", () => {
    const opening = elToggle.textContent === "Apri tutto";
    document.querySelectorAll(".day").forEach((el) => { el.open = opening; });
    elToggle.textContent = opening ? "Chiudi tutto" : "Apri tutto";
  });

  /* navigazione a un giorno */
  function goToDay(n) {
    if (view !== "days") document.querySelector('.tabs button[data-view="days"]').click();
    const el = document.getElementById("g" + n);
    el.hidden = false;
    el.open = true;
    el.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  document.addEventListener("click", (e) => {
    const goto = e.target.closest("[data-goto]");
    if (goto) { goToDay(Number(goto.dataset.goto)); return; }
    const leg = e.target.closest("[data-leg]");
    if (leg) {
      const first = DAYS.find((x) => x.leg === leg.dataset.leg);
      if (first) goToDay(first.n);
    }
  });

  /* ombra sulla barra sticky */
  const controls = document.getElementById("controls");
  const sentinel = document.createElement("div");
  controls.parentNode.insertBefore(sentinel, controls);
  new IntersectionObserver(([e]) => {
    controls.classList.toggle("stuck", e.intersectionRatio === 0);
  }, { threshold: [0, 1] }).observe(sentinel);

  /* apri il giorno di oggi, se siamo in viaggio */
  const t = today();
  const oggi = DAYS.find((x) => +d(x.date) === +t);
  if (oggi) {
    const el = document.getElementById("g" + oggi.n);
    el.open = true;
    requestAnimationFrame(() => el.scrollIntoView({ block: "center" }));
  } else {
    document.getElementById("g1").open = true;
  }
})();
</script>
